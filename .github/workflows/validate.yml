name: Validate EnixmaRouter

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm install --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: tests
      - run: npm install --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: cli
      - run: npm audit --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: tests
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: cli
      - run: node tests/node_modules/vitest/vitest.mjs run --config tests/vitest.config.js
        env:
          CI: "true"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
